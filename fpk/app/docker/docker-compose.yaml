version: "3.8"

services:
  teleagent:
    image: mwh1987/teleagent-web:latest
    container_name: fnos-teleagent
    restart: unless-stopped
    ports:
      - "${TRIM_SERVICE_PORT:-5800}:5800"
    environment:
      - PUID=0
      - PGID=0
      - TZ=Asia/Shanghai
      - DISPLAY_WIDTH=1440
      - DISPLAY_HEIGHT=900
    volumes:
      - "${TRIM_PKGVAR}/config:/config"
      - "${TRIM_APPDEST}/data:/workspace"
    shm_size: "1g"