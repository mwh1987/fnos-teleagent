version: "3.8"

services:
  teleagent:
    image: mwh1987/teleagent-web:latest
    container_name: fnos-teleagent
    restart: unless-stopped
    ports:
      - "${PORT:-5800}:5800"
    environment:
      - USER_ID=1000
      - GROUP_ID=1000
      - TAKE_CONFIG_OWNERSHIP=1
      - TZ=Asia/Shanghai
      - DISPLAY_WIDTH=1440
      - DISPLAY_HEIGHT=900
      - WEB_HOST_CLIPBOARD_SYNC=1
    volumes:
      - "${TRIM_PKGVAR}/config:/config"
      - "${TRIM_APPDEST}/data:/workspace"
    shm_size: "1g"