version: "3.8"

services:
  teleagent:
    image: ghcr.io/mwh1987/teleagent-web:latest
    container_name: fnos-teleagent
    restart: unless-stopped
    networks:
      teleagent_macvlan:
        ipv4_address: ${STATIC_IP:-192.168.1.188}
    environment:
      - PUID=0
      - PGID=0
      - TZ=Asia/Shanghai
      - DISPLAY_WIDTH=1440
      - DISPLAY_HEIGHT=900
      - WEB_PORT=${PORT:-5800}
    volumes:
      - "${TRIM_PKGVAR}/config:/config"
      - "${TRIM_DATA_SHARE_PATHS}:/workspace"
    shm_size: "1g"

networks:
  teleagent_macvlan:
    driver: macvlan
    driver_opts:
      parent: ${PARENT_NIC:-eth0}
    ipam:
      config:
        - subnet: ${SUBNET:-192.168.1.0/24}
          gateway: ${GATEWAY:-192.168.1.1}