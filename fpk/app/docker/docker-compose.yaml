version: "3.8"

services:
  teleagent:
    image: mwh1987/teleagent-web:2.7.3
    container_name: fnos-teleagent
    restart: unless-stopped
    ports:
      - "${PORT:-5800}:5800"
    environment:
      - USER_ID=1000
      - GROUP_ID=1000
      - TAKE_CONFIG_OWNERSHIP=1
      - TZ=Asia/Shanghai
      - DISPLAY_WIDTH=1440
      - DISPLAY_HEIGHT=900
      - WEB_HOST_CLIPBOARD_SYNC=1
      - PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/
      - PIP_TRUSTED_HOST=mirrors.aliyun.com
    volumes:
      - "${TRIM_PKGVAR}/config:/config"
      - "${WORKSPACE_PATH:-/vol1/@appshare/teleagent/workspace}:/workspace"
    shm_size: "1g"