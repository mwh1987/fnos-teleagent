name: Build & Publish TeleAgent FPK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  docker:
    name: Build & Push Multi-Arch Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/teleagent-web
            docker.io/${{ github.repository_owner }}/teleagent-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=2.7.3,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  fpk:
    name: Build fnOS FPK Package
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install fnpack
        run: |
          curl -sL "https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64" -o /usr/local/bin/fnpack
          chmod +x /usr/local/bin/fnpack
          fnpack --help

      - name: Build FPK Package
        run: |
          fnpack build --directory fpk
          ls -lh *.fpk

      - name: Upload FPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: teleagent.fpk
          path: "*.fpk"
          if-no-files-found: error

      - name: Create Release and Upload Asset
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: "*.fpk"
          tag_name: ${{ github.ref_name || 'latest' }}
          name: "TeleAgent fnOS FPK - ${{ github.ref_name || 'latest' }}"
          body: |
            ## 星辰超级智能体（TeleAgent）飞牛私有云 fnOS 安装包

            - **版本**：2.7.3
            - **架构**：全平台通用（x86_64 / arm64）
            - **网络模式**：Macvlan 独立局域网 IP（安装向导图形化配置）
            - **镜像仓库**：`mwh1987/teleagent-web:2.7.3` 与 `ghcr.io/${{ github.repository_owner }}/teleagent-web:latest`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
